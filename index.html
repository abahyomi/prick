<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Anti-FOUC: apply dark class before first paint -->
    <script>
      (function(){
        var s=localStorage.getItem('prick_dark_mode');
        if(s==='true'||(s===null&&window.matchMedia('(prefers-color-scheme:dark)').matches)){
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRICK — Abahyomi & Alexandra</title>
    <meta name="description" content="A visual diary and interactive photo album." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
